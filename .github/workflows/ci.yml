name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Secret Scan (TruffleHog / Git Secrets Check)
        run: |
          echo "Scanning for accidental secrets..."
          # Fail if accidental plain text private keys or .env are tracked
          if git ls-files | grep -E '(\.env$|\.env\.local$|\.pem$|\.key$)'; then
            echo "Error: Secret or environment file tracked in git repository!"
            exit 1
          fi

      - name: Type Check
        run: npm run typecheck

      - name: Linter Check
        run: npm run lint

      - name: Build Test
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
