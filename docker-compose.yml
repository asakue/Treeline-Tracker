version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: treeline-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-treeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-treeline_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-treeline_tracker}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-treeline} -d ${POSTGRES_DB:-treeline_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: treeline-mosquitto
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: treeline-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      mqtt-broker:
        condition: service_started
    environment:
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-treeline}:${POSTGRES_PASSWORD:-treeline_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-treeline_tracker}
      JWT_SECRET: ${JWT_SECRET:-replace_with_64_char_secure_random_key_treeline}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-replace_with_64_char_secure_refresh_key_treeline}
      MQTT_BROKER_URL: mqtt://mqtt-broker:1883
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "4000:4000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: treeline-frontend
    restart: always
    depends_on:
      - backend
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4000/ws}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  mosquitto_data:
