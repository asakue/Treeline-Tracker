# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Compute settings for Next.js SSR / Server Actions / API Routes
  maxInstances: 2
  minInstances: 0
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  # Map environmental variables and Google Secret Manager secrets
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: treeline-tracker
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
